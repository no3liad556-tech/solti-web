<style>
/* Plantilla Soltic · Menú digital con QR.
   Layout: una columna pensada para el celular; categorías fijas arriba, pedido fijo abajo.
   Colores del ejemplo: los del completo italiano (palta, tomate, mayo). Cambia estos tokens por los de cada cliente. */
:root {
  --brand: #2F6B34;        /* color principal del local (palta) */
  --brand-ink: #FFFFFF;
  --accent: #D8432E;       /* destacados (tomate) */
  --bg: #FFFDF8;           /* fondo (mayo) */
  --card: #FFFFFF;
  --fg: #1E2A1F;
  --muted: #5F6B5F;
  --line: #E6E2D6;
  --soft: #EEF4EC;
  --soft: color-mix(in srgb, var(--brand) 11%, var(--bg));
  --f-display: "Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #141A14; --card: #1C241C; --fg: #EEF2EA; --muted: #A9B4A6; --line: #2C382C; --soft: #223022; --soft: color-mix(in srgb, var(--brand) 22%, var(--bg)); color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #141A14; --card: #1C241C; --fg: #EEF2EA; --muted: #A9B4A6; --line: #2C382C; --soft: #223022; --soft: color-mix(in srgb, var(--brand) 22%, var(--bg)); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; font-family: var(--f-display); text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

.demo { background: #0B1F4A; color: #FFFFFF; font-size: 13px; }
.demo .wrap { display: flex; justify-content: space-between; gap: 12px; padding-block: 8px; flex-wrap: wrap; }
.demo a { color: #F5C94A; font-weight: 600; text-decoration: none; }

.tipos { background: #13306B; color: #B9C4DD; font-size: 14px; }
.tipos .wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 8px 10px; }
#tipos { display: flex; gap: 6px; flex-wrap: wrap; }
#tipos button { border: 1px solid rgba(255,255,255,.3); background: transparent; color: #FFFFFF; border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
#tipos button[aria-pressed="true"] { background: #F5C94A; color: #0B1F4A; border-color: #F5C94A; }
header.local .wrap { padding-block: 26px 18px; display: flex; flex-direction: column; gap: 12px; }
.flag { display: flex; gap: 6px; }
.flag i { width: 26px; height: 6px; border-radius: 3px; }
.local h1 { font-size: clamp(34px, 9vw, 46px); font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.local .tag { color: var(--muted); font-size: 16px; }
.info { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--soft); color: var(--fg); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
.chip.closed .dot { background: var(--accent); }
.chip.plain { background: transparent; border: 1px solid var(--line); font-weight: 500; color: var(--muted); }

.search { position: relative; }
.search input { width: 100%; font: 16px var(--f-body); color: var(--fg); background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px 12px 42px; }
.search svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); stroke: var(--muted); fill: none; stroke-width: 2; }

.cats { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.cats .scroll { overflow-x: auto; scrollbar-width: none; }
.cats .scroll::-webkit-scrollbar { display: none; }
.cats nav { display: flex; gap: 8px; padding-block: 10px; width: max-content; }
.cats a { text-decoration: none; font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 999px; color: var(--muted); white-space: nowrap; }
.cats a.on { background: var(--brand); color: var(--brand-ink); }

main .wrap { padding-block: 10px 140px; display: flex; flex-direction: column; gap: 30px; }
section.cat { scroll-margin-top: 70px; display: flex; flex-direction: column; gap: 4px; }
section.cat h2 { font-size: 26px; font-weight: 800; display: flex; align-items: baseline; gap: 10px; padding-block: 8px 6px; }
section.cat h2 small { font: 500 14px var(--f-body); color: var(--muted); }
.item { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; padding: 16px 0; border-bottom: 1px dashed var(--line); }
.item:last-child { border-bottom: 0; }
.item .txt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.item h3 { font: 700 17px var(--f-body); }
.item p { color: var(--muted); font-size: 14.5px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.b { font-size: 12px; font-weight: 700; letter-spacing: .02em; padding: 2px 8px; border-radius: 6px; }
.b-reco { background: var(--accent); color: #FFFFFF; }
.b-veg { background: var(--soft); color: var(--brand); }
.b-pic { background: #FDE8E4; color: #A4301F; }
.b-new { background: #FFF1C9; color: #7A5A00; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.price { font: 800 18px var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.add { border: 0; background: var(--brand); color: var(--brand-ink); font-weight: 700; font-size: 14px; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.step { display: inline-flex; align-items: center; gap: 4px; background: var(--soft); border-radius: 999px; padding: 3px; }
.step button { width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--card); font-weight: 800; font-size: 17px; cursor: pointer; color: var(--brand); }
.step span { min-width: 22px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.out { font-size: 13px; font-weight: 700; color: var(--accent); }
.item.agotado h3, .item.agotado .price { opacity: .5; }
.none { color: var(--muted); padding: 20px 0; }

.cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(transparent, var(--bg) 30%); }
.cartbar button { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 648px; margin: 0 auto; border: 0; border-radius: 16px; background: var(--fg); color: var(--bg); padding: 15px 20px; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 10px 24px rgba(0,0,0,.2); }
.cartbar .count { background: var(--accent); color: #FFFFFF; border-radius: 999px; padding: 1px 9px; margin-right: 8px; }

.sheet { position: fixed; inset: 0; z-index: 40; background: rgba(10,15,10,.45); display: flex; align-items: flex-end; justify-content: center; }
.panel { background: var(--card); width: 100%; max-width: 680px; max-height: 88%; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; }
.panel h2 { font-size: 24px; }
.x { border: 0; background: var(--soft); width: 36px; height: 36px; border-radius: 50%; font-size: 20px; cursor: pointer; }
.lines { display: flex; flex-direction: column; }
.line { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.line span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.total { display: flex; justify-content: space-between; font: 800 20px var(--f-display); font-variant-numeric: tabular-nums; }
.seg { display: flex; gap: 8px; }
.seg label { flex: 1; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: block; text-align: center; padding: 11px; border-radius: 12px; border: 1.5px solid var(--line); font-weight: 600; cursor: pointer; }
.seg input:checked + span { border-color: var(--brand); background: var(--soft); color: var(--brand); }
.seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 14.5px; }
.field input, .field textarea { font: 16px var(--f-body); color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 13px; width: 100%; }
.send { display: flex; justify-content: center; align-items: center; gap: 10px; text-decoration: none; background: #1FA855; color: #FFFFFF; font-weight: 700; font-size: 17px; border-radius: 16px; padding: 15px; }
.send svg { width: 22px; height: 22px; fill: #FFFFFF; }
.hint { font-size: 13px; color: var(--muted); text-align: center; }

footer { border-top: 1px solid var(--line); }
footer .wrap { padding-block: 22px 120px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
footer a { color: var(--fg); font-weight: 700; }

/* Fotos */
.thumb { width: 88px; height: 88px; border-radius: 16px; overflow: hidden; flex: none; background: var(--soft); }
.thumb svg, .thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
.item { grid-template-columns: 88px 1fr !important; align-items: start; }
.item .bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 6px; }
.item.agotado .thumb { filter: grayscale(1); opacity: .55; }
.feat { display: flex; flex-direction: column; gap: 12px; }
.feat h2 { font-size: 22px; font-weight: 800; }
.feat .scroll { overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding: 0 4px 6px; }
.feat .scroll::-webkit-scrollbar { display: none; }
.feat .row { display: flex; gap: 14px; width: max-content; }
.fcard { width: 200px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
.fcard .pic { height: 140px; background: var(--soft); }
.fcard .pic svg { width: 100%; height: 100%; display: block; }
.fcard .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.fcard h3 { font: 700 16px var(--f-body); }
.fcard .bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.fcard .price { font-size: 17px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

function pic(it) {
  if (it.foto) return '<img src="' + esc(it.foto) + '" alt="' + esc(it.n) + '" loading="lazy">';
  return '<svg viewBox="0 0 120 120" preserveAspectRatio="xMidYMid slice" role="img" aria-label="' + esc(it.n) + '">' + (ART[it.img] || bg('#EEF4EC')) + '</svg>';
}

var BADGE = { reco: ['Recomendado', 'b-reco'], veg: ['Vegetariano', 'b-veg'], pic: ['Picante', 'b-pic'], new: ['Nuevo', 'b-new'] };
var money = function (n) { return '$' + n.toLocaleString('es-CL'); };
var slug = function (s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-'); };
var cart = {};
var esc = function (s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; };


function estado() {
  var now = new Date(), min = function (h) { var a = h.split(':'); return +a[0] * 60 + +a[1]; };
  var t = now.getHours() * 60 + now.getMinutes();
  var check = function (day, offset) {
    var h = LOCAL.horario[day]; if (!h) return null;
    var o = min(h[0]), c = min(h[1]); if (c <= o) c += 1440;
    var x = t + offset; return (x >= o && x < c) ? h[1] : null;
  };
  var today = now.getDay(), yday = (today + 6) % 7;
  var open = check(today, 0) || check(yday, 1440);
  var el = document.getElementById('r-estado');
  el.classList.toggle('closed', !open);
  el.lastElementChild.textContent = open ? 'Abierto ahora · cierra ' + open : 'Cerrado ahora';
}


function control(it, key, qty) {
  if (it.agotado) return '<span class="out">Agotado</span>';
  if (qty) return '<span class="step"><button type="button" data-k="' + esc(key) + '" data-d="-1" aria-label="Quitar uno">−</button><span>' + qty + '</span><button type="button" data-k="' + esc(key) + '" data-d="1" aria-label="Agregar uno">+</button></span>';
  return '<button class="add" type="button" data-k="' + esc(key) + '" data-d="1">Agregar</button>';
}
function featured(q) {
  if (q) return '';
  var cards = '';
  MENU.forEach(function (c) { c.items.forEach(function (it) {
    if ((it.t || []).indexOf('reco') < 0 || it.agotado) return;
    var key = c.cat + '|' + it.n, qty = cart[key] ? cart[key].q : 0;
    cards += '<article class="fcard"><div class="pic">' + pic(it) + '</div><div class="body"><h3>' + esc(it.n) + '</h3><div class="bottom"><span class="price">' + money(it.p) + '</span>' + control(it, key, qty) + '</div></div></article>';
  }); });
  return cards ? '<section class="feat" aria-label="Recomendados de la casa"><h2>Recomendados de la casa</h2><div class="scroll"><div class="row">' + cards + '</div></div></section>' : '';
}
function render(q) {
  q = (q || '').trim().toLowerCase();
  var html = '', nav = '', hits = 0;
  MENU.forEach(function (c) {
    var items = c.items.filter(function (it) { return !q || (it.n + ' ' + it.d).toLowerCase().indexOf(q) > -1; });
    if (!items.length) return;
    var id = slug(c.cat); hits += items.length;
    nav += '<a href="#' + id + '" data-id="' + id + '">' + esc(c.cat) + '</a>';
    html += '<section class="cat" id="' + id + '"><h2>' + esc(c.cat) + ' <small>' + items.length + '</small></h2>';
    items.forEach(function (it) {
      var key = c.cat + '|' + it.n, qty = cart[key] ? cart[key].q : 0;
      var badges = (it.t || []).map(function (b) { return '<span class="b ' + BADGE[b][1] + '">' + BADGE[b][0] + '</span>'; }).join('');
      var ctrl = control(it, key, qty); var _unused = it.agotado ? '<span class="out">Agotado</span>'
        : qty ? '<span class="step"><button type="button" data-k="' + esc(key) + '" data-d="-1" aria-label="Quitar uno">−</button><span>' + qty + '</span><button type="button" data-k="' + esc(key) + '" data-d="1" aria-label="Agregar uno">+</button></span>'
        : '<button class="add" type="button" data-k="' + esc(key) + '" data-d="1">Agregar</button>';
      html += '<article class="item' + (it.agotado ? ' agotado' : '') + '"><div class="thumb">' + pic(it) + '</div><div class="txt"><h3>' + esc(it.n) + '</h3><p>' + esc(it.d) + '</p>' + (badges ? '<div class="badges">' + badges + '</div>' : '') + '<div class="bottom"><span class="price">' + money(it.p) + '</span>' + ctrl + '</div></div></article>';
    });
    html += '</section>';
  });
  document.getElementById('menu').innerHTML = hits ? featured(q) + html : '<p class="none">No encontramos "' + esc(q) + '" en el menú. Prueba con otra palabra.</p>';
  document.getElementById('cats').innerHTML = nav;
  spy();
}
function find(key) { var p = key.split('|'); for (var i = 0; i < MENU.length; i++) if (MENU[i].cat === p[0]) for (var j = 0; j < MENU[i].items.length; j++) if (MENU[i].items[j].n === p[1]) return MENU[i].items[j]; }
document.getElementById('menu').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-k]'); if (!b) return;
  var k = b.getAttribute('data-k'), d = +b.getAttribute('data-d'), it = find(k);
  if (!cart[k]) cart[k] = { it: it, q: 0 };
  cart[k].q += d; if (cart[k].q <= 0) delete cart[k];
  render(document.getElementById('q').value); updateCart();
});
document.getElementById('q').addEventListener('input', function (e) { render(e.target.value); });

function updateCart() {
  var n = 0, tot = 0, lines = '';
  Object.keys(cart).forEach(function (k) { var c = cart[k]; n += c.q; tot += c.q * c.it.p; lines += '<div class="line"><span>' + c.q + ' × ' + esc(c.it.n) + '</span><span>' + money(c.q * c.it.p) + '</span></div>'; });
  document.getElementById('cartbar').hidden = n === 0;
  document.getElementById('c-count').textContent = n;
  document.getElementById('c-total').textContent = money(tot);
  document.getElementById('p-total').textContent = money(tot);
  document.getElementById('lines').innerHTML = lines;
  if (n === 0) document.getElementById('sheet').hidden = true;
  link();
}
function link() {
  var llevar = document.getElementById('t-llevar').checked;
  document.getElementById('f-mesa').hidden = llevar;
  var msg = 'Hola ' + LOCAL.nombre + ', quiero hacer este pedido:\n';
  var tot = 0;
  Object.keys(cart).forEach(function (k) { var c = cart[k]; tot += c.q * c.it.p; msg += '• ' + c.q + ' × ' + c.it.n + ' (' + money(c.q * c.it.p) + ')\n'; });
  msg += 'Total: ' + money(tot) + '\n';
  msg += llevar ? 'Para llevar' : 'Mesa: ' + (document.getElementById('mesa').value.trim() || 'por confirmar');
  var nota = document.getElementById('nota').value.trim(); if (nota) msg += '\nComentario: ' + nota;
  document.getElementById('send').href = 'https://wa.me/' + LOCAL.whatsapp + '?text=' + encodeURIComponent(msg);
}
['t-mesa', 't-llevar', 'mesa', 'nota'].forEach(function (id) { document.getElementById(id).addEventListener('input', link); document.getElementById(id).addEventListener('change', link); });
document.getElementById('open-cart').addEventListener('click', function () { document.getElementById('sheet').hidden = false; document.getElementById('close-cart').focus(); });
document.getElementById('close-cart').addEventListener('click', function () { document.getElementById('sheet').hidden = true; });
document.getElementById('sheet').addEventListener('click', function (e) { if (e.target.id === 'sheet') e.currentTarget.hidden = true; });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.getElementById('sheet').hidden = true; });

function spy() {
  var links = document.querySelectorAll('#cats a'), secs = document.querySelectorAll('section.cat');
  var on = function () {
    var cur = secs[0] ? secs[0].id : '';
    secs.forEach(function (s) { if (s.getBoundingClientRect().top < 120) cur = s.id; });
    links.forEach(function (a) {
      var act = a.getAttribute('data-id') === cur; a.classList.toggle('on', act);
      if (act) { var sc = a.closest('.scroll'); var l = a.offsetLeft - 20; if (Math.abs(sc.scrollLeft - l) > 40) sc.scrollLeft = l; }
    });
  };
  window.onscroll = on; on();
}
function useDemo(id) {
  if (!DEMOS[id]) id = 'sangucheria';
  var d = DEMOS[id]; LOCAL = d.local; MENU = d.menu; cart = {};
  var r = document.documentElement.style;
  r.setProperty('--brand', d.colores.brand); r.setProperty('--accent', d.colores.accent);
  document.getElementById('r-nombre').textContent = LOCAL.nombre;
  document.getElementById('r-tag').textContent = LOCAL.descripcion;
  document.getElementById('r-dir').textContent = LOCAL.direccion;
  document.getElementById('r-horario').textContent = LOCAL.horarioTexto;
  var av = document.getElementById('r-aviso'); av.hidden = !LOCAL.aviso; av.textContent = LOCAL.aviso || '';
  document.getElementById('q').value = '';
  document.getElementById('q').placeholder = 'Buscar en el menú… ej: ' + MENU[0].items[0].n.toLowerCase();
  document.querySelectorAll('#tipos button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.demo === id ? 'true' : 'false'); });
  estado(); render(''); updateCart(); window.scrollTo(0, 0);
}
var tipos = document.getElementById('tipos');
Object.keys(DEMOS).forEach(function (id) {
  var b = document.createElement('button'); b.type = 'button'; b.dataset.demo = id; b.textContent = DEMOS[id].boton;
  b.addEventListener('click', function () { if (location.hash !== '#' + id) location.hash = id; else useDemo(id); });
  tipos.appendChild(b);
});
window.addEventListener('hashchange', function () { useDemo(location.hash.slice(1)); });
useDemo(location.hash.slice(1));
</script>
