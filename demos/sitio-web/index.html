<title>Sitios web Soltic</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow+Condensed:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Plantilla Soltic · Sitio web para negocios. Layout: portada con llamado a la acción, servicios con precio,
   módulo de acción según el rubro (reserva u orden por WhatsApp), datos de contacto. Colores y fuentes cambian por negocio. */
:root {
  --brand: #111111; --accent: #C77B3A; --bg: #FFFFFF; --alt: #F5F3EF; --card: #FFFFFF; --fg: #161616; --muted: #5E5B55; --line: #E5E1DA; --on-brand: #FFFFFF;
  --f-display: "Oswald", "Arial Narrow", sans-serif; --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121212; --alt: #1A1A1A; --card: #1E1E1E; --fg: #F1EFEA; --muted: #ABA79F; --line: #2E2E2C; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #121212; --alt: #1A1A1A; --card: #1E1E1E; --fg: #F1EFEA; --muted: #ABA79F; --line: #2E2E2C; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16.5px; line-height: 1.55; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.demo { background: #0B1F4A; color: #B9C4DD; font-size: 13.5px; }
.demo .wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 8px; }
.demo b { color: #FFFFFF; font-weight: 600; }
.demo a { color: #F5C94A; font-weight: 700; margin-left: auto; text-decoration: none; }
#tipos { display: flex; gap: 6px; }
#tipos button { border: 1px solid rgba(255,255,255,.3); background: transparent; color: #FFFFFF; border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 13px; cursor: pointer; }
#tipos button[aria-pressed="true"] { background: #F5C94A; color: #0B1F4A; border-color: #F5C94A; }

.top { background: var(--brand); color: var(--on-brand); }
.top .wrap { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding-block: 14px; }
.logo { font: 700 22px var(--f-display); letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.logo i { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: inline-block; }
.top nav { display: flex; gap: 22px; align-items: center; }
.top nav a { color: inherit; opacity: .8; text-decoration: none; font-weight: 600; font-size: 15px; }
.btn { display: inline-flex; align-items: center; gap: 9px; border: 0; border-radius: 10px; padding: 13px 20px; font-weight: 700; text-decoration: none; cursor: pointer; }
.btn-a { background: var(--accent); color: #FFFFFF; }
.btn-o { border: 1.5px solid currentColor; color: inherit; background: transparent; }
.btn svg { width: 20px; height: 20px; fill: currentColor; }
.top .btn { padding: 9px 14px; }
.top nav a.btn { opacity: 1; }
@media (max-width: 760px) { .top nav a { display: none; } }

.hero { background: var(--brand); color: var(--on-brand); position: relative; overflow: hidden; }
.hero .wrap { display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: center; padding-block: 56px 70px; }
.hero small { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-size: 13px; }
.hero h1 { font-size: clamp(38px, 6vw, 64px); line-height: 1.02; margin-top: 10px; text-transform: uppercase; }
.hero p { margin-top: 16px; font-size: 18px; opacity: .85; max-width: 32em; }
.hero .acts { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
.hero .facts { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 28px; font-size: 14.5px; opacity: .85; }
.hero .facts b { display: block; font: 700 22px var(--f-display); color: var(--accent); opacity: 1; }
.art { aspect-ratio: 1; max-width: 420px; width: 100%; justify-self: end; border-radius: 28px; background: rgba(255,255,255,.06); display: grid; place-items: center; }
.art svg { width: 78%; height: 78%; }
@media (max-width: 820px) { .hero .wrap { grid-template-columns: 1fr; padding-block: 40px 52px; } .art { max-width: 260px; justify-self: start; } }

section.s { padding-block: 64px; }
.alt { background: var(--alt); }
.sh { display: flex; flex-direction: column; gap: 8px; margin-bottom: 30px; max-width: 620px; }
.sh small { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-size: 13px; }
.sh h2 { font-size: clamp(30px, 4vw, 42px); text-transform: uppercase; line-height: 1.05; }
.sh p { color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.svc { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.svc .ic { width: 46px; height: 46px; border-radius: 12px; background: var(--brand); display: grid; place-items: center; }
.svc .ic svg { width: 26px; height: 26px; stroke: var(--accent); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.svc h3 { font-size: 21px; text-transform: uppercase; letter-spacing: .02em; }
.svc p { color: var(--muted); font-size: 15px; }
.svc .row { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-top: 6px; border-top: 1px dashed var(--line); }
.svc .price { font: 700 22px var(--f-display); font-variant-numeric: tabular-nums; }
.svc .row small { color: var(--muted); font-size: 13.5px; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 580px) { .grid { grid-template-columns: 1fr; } }

.why { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.why div { border-top: 3px solid var(--accent); padding-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.why h3 { font-size: 20px; text-transform: uppercase; }
.why p { color: var(--muted); font-size: 15px; }
@media (max-width: 760px) { .why { grid-template-columns: 1fr; } }

.action { display: grid; grid-template-columns: .9fr 1.1fr; gap: 32px; align-items: start; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 7px; border: 0; margin: 0; padding: 0; min-width: 0; }
.field label, .field legend { font-weight: 700; font-size: 14.5px; padding: 0; }
.field input, .field select, .field textarea { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 11px 13px; width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chips span { display: inline-block; border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: 14.5px; cursor: pointer; font-variant-numeric: tabular-nums; }
.chips input:checked + span { border-color: var(--accent); background: var(--accent); color: #FFFFFF; }
.chips input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.chips input:disabled + span { opacity: .35; text-decoration: line-through; cursor: not-allowed; }
.wa { display: flex; justify-content: center; align-items: center; gap: 10px; background: #1FA855; color: #FFFFFF; font-weight: 700; font-size: 17px; border-radius: 12px; padding: 15px; text-decoration: none; }
.wa svg { width: 22px; height: 22px; fill: #FFFFFF; }
.hint { font-size: 13.5px; color: var(--muted); }
.info { display: flex; flex-direction: column; gap: 18px; }
.info .k { font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 12.5px; color: var(--accent); }
.info .v { font-size: 17px; }
.info a { color: inherit; font-weight: 700; }
@media (max-width: 820px) { .action { grid-template-columns: 1fr; } }

footer { background: var(--brand); color: var(--on-brand); }
footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 24px; font-size: 14px; opacity: .85; }
footer a { color: var(--accent); font-weight: 700; }
.float { position: fixed; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 50%; background: #1FA855; display: grid; place-items: center; box-shadow: 0 10px 22px rgba(0,0,0,.25); z-index: 30; }
.float svg { width: 30px; height: 30px; fill: #FFFFFF; }
</style>

<script>

    nombre: 'Ferretería El Tornillo', whatsapp: '56973020975',

};

  scissors: '<circle cx="6" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M8.6 7.6L20 18M8.6 16.4L20 6"/>',
  beard: '<path d="M5 8c0 7 3 12 7 12s7-5 7-12"/><path d="M9 14c1.5 1 4.5 1 6 0"/><path d="M5 8c2-3 12-3 14 0"/>',
  razor: '<path d="M3 17l9-9 4 4-9 9H3z"/><path d="M14 6l3-3 4 4-3 3"/>',
  fade: '<path d="M4 20h16"/><path d="M6 16h12"/><path d="M8 12h8"/><path d="M10 8h4"/>',
  towel: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 9h16M9 4v5"/>',
  kid: '<circle cx="12" cy="8" r="4"/><path d="M5 21c1-4 3.5-6 7-6s6 2 7 6"/>',

var esc = function (s) { var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; };

function dias() {

function render(id) {

    '<section class="hero"><div class="wrap"><div><small>' + esc(D.eyebrow) + '</small><h1>' + esc(D.titulo) + '</h1><p>' + esc(D.bajada) + '</p><div class="acts"><a class="btn btn-a" href="#accion">' + esc(D.cta) + '</a><a class="btn btn-o" href="#servicios">Ver ' + (D.accion === 'reserva' ? 'servicios' : 'productos') + '</a></div>' +
    '<div class="facts">' + D.datos.map(function (x) { return '<span><b>' + esc(x[0]) + '</b>' + esc(x[1]) + '</span>'; }).join('') + '</div></div><div class="art">' + ART[D.arte] + '</div></div></section>' +

    '<section class="s alt"><div class="wrap"><div class="sh"><small>Por qué elegirnos</small><h2>' + esc(D.nombre) + '</h2></div><div class="why">' + D.por.map(function (p) { return '<div><h3>' + esc(p[0]) + '</h3><p>' + esc(p[1]) + '</p></div>'; }).join('') + '</div></div></section>' +

function val(name) { var e = document.querySelector('input[name="' + name + '"]:checked'); return e ? e.value : ''; }
function link() {
  var a = document.getElementById('go'); if (!a) return;
  var nom = (document.getElementById('f-nom').value || '').trim(), msg;
  if (D.accion === 'reserva') msg = 'Hola ' + D.nombre + ', quiero reservar:\n• ' + document.getElementById('f-svc').value + '\n• ' + val('dia') + ' a las ' + val('hora') + (nom ? '\nA nombre de: ' + nom : '');
  else msg = 'Hola ' + D.nombre + ', quiero cotizar esta lista:\n' + ((document.getElementById('f-lista').value || '').trim() || '(escribe tu lista aquí)') + '\nEntrega: ' + val('ent') + (nom ? '\nA nombre de: ' + nom : '');
  a.href = waLink(msg);
}
document.addEventListener('input', link);
document.addEventListener('change', link);
document.addEventListener('submit', function (e) { e.preventDefault(); });
var tipos = document.getElementById('tipos');
Object.keys(DEMOS).forEach(function (id) {
  var b = document.createElement('button'); b.type = 'button'; b.dataset.demo = id; b.textContent = DEMOS[id].boton;
  b.addEventListener('click', function () { if (location.hash !== '#' + id) location.hash = id; else render(id); });
  tipos.appendChild(b);
});
window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (DEMOS[h]) render(h); });
render(location.hash.slice(1));
</script>
