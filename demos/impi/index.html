:root[data-theme="dark"] { --bg: #111111; --card: #1B1B1B; --fg: #F2F1EC; --muted: #A9A79F; --line: #2C2C2A; --soft: #2A2610; --ok-bg: #12301F; --ok: #6FD49A; --warn-bg: #33270A; --warn: #F2C14E; --bad-bg: #3A0D17; --bad: #FF6B85; --info-bg: #3A0E28; --info: #FF8CCB; color-scheme: dark; }

function buscar(q) {
  q = q.trim().toLowerCase(); if (q.length < 2) return [];
  var r = [];
  CLIENTES.forEach(function (c) { if (c.n.toLowerCase().indexOf(q) > -1) r.push(['Cliente', c.n, c.t, 'clientes']); });
  VENTAS.forEach(function (v) { if (String(v.folio).indexOf(q) > -1 || v.cl.toLowerCase().indexOf(q) > -1) r.push(['Venta', 'Venta #' + v.folio + ' · ' + v.cl, $(v.tot) + (v.tot > v.paid ? ' · saldo ' + $(v.tot - v.paid) : ''), 'ventas']); });

  TRABAJOS.forEach(function (t) { if (String(t.id).indexOf(q) > -1 || (t.t + ' ' + t.cl).toLowerCase().indexOf(q) > -1) r.push(['Producción', '#' + t.id + ' ' + t.t, t.cl + ' · ' + t.e, 'produccion']); });

function parse(txt) {
  var t = txt.toLowerCase(), r = { q: 1, pid: null, cl: '', tot: 0, pago: 'Efectivo' };
  PRODUCTOS.forEach(function (p) { p.k.forEach(function (k) { if (t.indexOf(k) > -1 && !r.pid) r.pid = p.id; }); });
  var m = t.match(/(?:vend[ií]|venta de|son|fueron)?\s*(\d+|un|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|doce|veinte|cien)\s+[a-záéíóúñ]/);
  if (m) r.q = /\d/.test(m[1]) ? +m[1] : NUMS[m[1]];
  var mm = txt.match(/\$\s?([\d.]+)/) || txt.match(/por\s+([\d.]{4,})/i);
  if (mm) r.tot = +mm[1].replace(/\./g, '');
  var mc = txt.match(/\s(?:a|al|para)\s+(?:la\s+|el\s+)?([A-ZÁÉÍÓÚÑ][\wÁÉÍÓÚÑáéíóúñ]*(?:\s+[A-ZÁÉÍÓÚÑ][\wÁÉÍÓÚÑáéíóúñ]*)*)/);
  if (mc) r.cl = mc[1];

  if (!r.tot && r.pid) r.tot = prod(r.pid).p * r.q;

}

  var b = e.target.closest('button'); if (!b) return;
  if (b.id === 'm-reg' || b.id === 'm-con') { modo = b.id === 'm-reg' ? 'reg' : 'con'; go(); return; }
  if (b.closest('#sugs')) { send(b.textContent); return; }
  if (b.dataset.rol) { ROL = b.dataset.rol; go(); toast(ROL === 'empleado' ? 'Vista de <b>empleado</b>: sin datos financieros' : 'Vista de <b>dueña</b>'); return; }
  if (b.dataset.vf) { filtroV = b.dataset.vf; go(); return; }
  if (b.dataset.ab) { abonando = +b.dataset.ab; go(); window.scrollTo(0, 0); return; }
  if (b.dataset.cerrar) { abonando = null; convirtiendo = null; abierto = null; clienteSel = null; go(); return; }
  if (b.dataset.abrir) { abierto = b.dataset.abrir; abonando = null; convirtiendo = null; go(); window.scrollTo(0, 0); var f = document.querySelector('.fcard input, .fcard select'); if (f) f.focus(); return; }
  if (b.dataset.guardar) { guardar(b.dataset.guardar); return; }
  if (b.dataset.cli) { clienteSel = +b.dataset.cli; abierto = null; go(); window.scrollTo(0, 0); return; }
  if (b.dataset.wacli) { toast('En el sistema real se abre WhatsApp con <b>' + esc(CLIENTES[+b.dataset.wacli].n) + '</b>'); return; }
  if (b.dataset.rechq) { COTIZACIONES[+b.dataset.rechq].st = 'Rechazada'; go(); toast('Cotización marcada como rechazada'); return; }
  if (b.dataset.exportar) { toast('En el sistema real se descarga el reporte en <b>' + b.dataset.exportar + '</b>'); return; }
  if (b.dataset.video) { toast('En el sistema real se abre el video <b>' + esc(VIDEOS[+b.dataset.video][0]) + '</b>'); return; }
  if (b.dataset.invitar) { toast('En el sistema real se envía una invitación por correo'); return; }
  if (b.dataset.abonar) {
    var v = VENTAS[+b.dataset.abonar], m = Math.min(parseInt(String(document.getElementById('ab-m').value).replace(/\D/g, ''), 10) || 0, v.tot - v.paid);
    if (m <= 0) { toast('Ingresa un monto mayor a cero'); return; }
    v.paid += m; CAJA.push({ h: new Date().toTimeString().slice(0, 5), d: 'Abono venta #' + v.folio, m: m, tipo: 'in' }); abonando = null; go();
    toast(v.tot > v.paid ? 'Abono de <b>' + $(m) + '</b> registrado · saldo ' + $(v.tot - v.paid) : 'Venta #' + v.folio + ' <b>pagada completa</b>'); return;
  }
  if (b.dataset.recordar) { toast('En el sistema real se abre WhatsApp con el recordatorio de saldo listo para enviar'); return; }
  if (b.dataset.conv) { convirtiendo = +b.dataset.conv; go(); window.scrollTo(0, 0); return; }
  if (b.dataset.convertir) {
    var c = COTIZACIONES[+b.dataset.convertir], tot = qTotal(c), pg = Math.min(parseInt(String(document.getElementById('cv-m').value).replace(/\D/g, ''), 10) || 0, tot);
    var folio = Math.max.apply(null, VENTAS.map(function (x) { return x.folio; })) + 1, tid = Math.max.apply(null, TRABAJOS.map(function (x) { return x.id; })) + 1;
    VENTAS.unshift({ folio: folio, f: 'Hoy ' + new Date().toTimeString().slice(0, 5), cl: c.cl, pid: null, desc: c.items[0][0] + (c.items.length > 1 ? ' y más' : ''), q: 1, tot: tot, paid: pg, pago: 'Transferencia', doc: 'Factura', nueva: true });
    TRABAJOS.push({ id: tid, t: c.items[0][0], cl: c.cl, e: 'Pendiente', f: 'Por definir' });
    if (pg > 0) CAJA.push({ h: new Date().toTimeString().slice(0, 5), d: 'Abono venta #' + folio, m: pg, tipo: 'in' });
    SEMANA[SEMANA.length - 1] += tot; c.st = 'Convertida'; convirtiendo = null; go();
    toast('Venta <b>#' + folio + '</b> creada y trabajo <b>#' + tid + '</b> enviado a Producción'); return;
  }
  if (b.dataset.enviarq) { var cq = COTIZACIONES[+b.dataset.enviarq]; if (cq.st === 'Borrador') cq.st = 'Enviada'; go(); toast('En el sistema real se abre WhatsApp con la cotización #' + cq.folio + ' lista para enviar'); return; }
  if (b.dataset.aceptq) { COTIZACIONES[+b.dataset.aceptq].st = 'Aceptada'; go(); toast('Cotización marcada como aceptada'); return; }
  if (b.dataset.avisar) { var tj = TRABAJOS.filter(function (x) { return x.id === +b.dataset.avisar; })[0]; tj.avisado = true; go(); toast('Cliente avisado. En el sistema real se abre WhatsApp con el mensaje: "Tu pedido #' + tj.id + ' está listo para retiro"'); return; }
  if (b.dataset.move) { var t = TRABAJOS.filter(function (x) { return x.id === +b.dataset.move; })[0]; var i = ESTADOS.map(function (x) { return x[0]; }).indexOf(t.e); t.e = ESTADOS[i + 1][0]; go(); toast('Pedido <b>#' + t.id + '</b> movido a ' + t.e); return; }
  if (b.dataset.reg) {
    var k = b.dataset.reg, p = document.getElementById('pv-p' + k).value, q = parseInt(document.getElementById('pv-q' + k).value, 10) || 1, tot = parseInt(String(document.getElementById('pv-t' + k).value).replace(/\D/g, ''), 10) || prod(p).p * q;
    var cl = document.getElementById('pv-cl' + k).value.trim() || 'Cliente sin nombre', pago = document.getElementById('pv-g' + k).value;
    VENTAS.unshift({ folio: Math.max.apply(null, VENTAS.map(function (x) { return x.folio; })) + 1, f: 'Hoy ' + new Date().toTimeString().slice(0, 5), cl: cl, pid: p, q: q, tot: tot, paid: tot, pago: pago, doc: 'Boleta', nueva: true });
    CAJA.push({ h: new Date().toTimeString().slice(0, 5), d: 'Venta · ' + cl, m: tot, tipo: 'in' });
    SEMANA[SEMANA.length - 1] += tot;
    var h = hist.reg; h[+k] = { a: 1, html: '<b>Listo, venta registrada:</b> ' + q + ' × ' + esc(prod(p).n) + ' a ' + esc(cl) + ' por ' + $(tot) + ' (' + pago + '). Ya aparece en Ventas, Caja y el Dashboard.' };
    drawChat(); toast('Venta registrada por <b>' + $(tot) + '</b>');
  }
});
window.addEventListener('hashchange', go);
go();
</script>

</html>
